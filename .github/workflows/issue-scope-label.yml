name: Issue scope

# Enforces the issue title scope prefix documented in CONTRIBUTING.md.
# A recognized prefix becomes a `scope: *` label; a missing one gets
# `needs-scope` and a single explanatory comment. Editing the title to conform
# clears both. Nothing here depends on how the issue was filed, so `gh issue
# create` and the web UI behave identically.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SCOPES = {
              suite:    { name: 'scope: suite',    color: '0e8a16', description: 'The skill suite (suite/)' },
              cli:      { name: 'scope: cli',      color: '1d76db', description: 'The Antmay CLI (cli/)' },
              contract: { name: 'scope: contract', color: '5319e7', description: 'The suite/CLI contract' },
              repo:     { name: 'scope: repo',     color: 'c5def5', description: 'Neither module: method docs, tooling, README' },
            };
            const NEEDS_SCOPE = {
              name: 'needs-scope', color: 'd93f0b', description: 'Title is missing a [suite|cli|contract|repo] prefix',
            };
            const MARKER = '<!-- antmay:scope-convention -->';

            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issue_number = issue.number;

            // A prefix only counts when something follows it — `[cli]` alone is not a title.
            const match = (issue.title || '').match(/^\s*\[\s*([a-zA-Z]+)\s*\]\s*\S/);
            const key = match ? match[1].toLowerCase() : null;
            const wanted = key && SCOPES[key] ? SCOPES[key] : NEEDS_SCOPE;

            const ensureLabel = async (label) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: label.name, color: label.color, description: label.description,
                });
              }
            };

            const managed = [...Object.values(SCOPES), NEEDS_SCOPE].map((label) => label.name);
            const current = (issue.labels || []).map((label) => label.name);

            for (const name of current.filter((n) => managed.includes(n) && n !== wanted.name)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            if (!current.includes(wanted.name)) {
              await ensureLabel(wanted);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [wanted.name] });
            }

            if (wanted !== NEEDS_SCOPE) {
              core.info(`Scope prefix recognized: ${wanted.name}`);
              return;
            }

            // Explain the convention once, however many times the title is edited.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(MARKER))) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                MARKER,
                "Thanks for the report. This repository asks every issue title to open with a scope prefix, so it is clear which module the issue belongs to:",
                '',
                '| Prefix | Scope |',
                '| --- | --- |',
                '| `[suite]` | The skill suite — `suite/` |',
                '| `[cli]` | The Antmay CLI — `cli/` |',
                '| `[contract]` | The contract between the two — skill names the pipeline invokes, or the terminal-outcome protocol |',
                '| `[repo]` | Neither module — method docs, repo tooling, README |',
                '',
                'For example: `[cli] afk resume loses the checkpoint after a failed stage`.',
                '',
                `Edit the title to add one and this comment stops applying — the label updates automatically. See [CONTRIBUTING.md](${context.payload.repository.html_url}/blob/HEAD/CONTRIBUTING.md).`,
              ].join('\n'),
            });
